name: CryptScript CI

on:
  push:
    branches:
      - CICD-branch

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python version
        run: python --version

      - name: Compile Python files
        run: |
          python -m py_compile my_crypt_script_v2.py
          python -m py_compile encrypt_files.py
          python -m py_compile decrypt_files.py
